name: Lint shell scripts

on:
  push:
    paths:
      - "**.sh"
      - ".github/workflows/shellcheck.yml"
  pull_request:
    paths:
      - "**.sh"
      - ".github/workflows/shellcheck.yml"

# Least privilege: linting only needs to read the checkout.
permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # actions/checkout v5.1.0, pinned to its commit SHA
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      # ShellCheck ships preinstalled on GitHub's ubuntu-latest runners, so no
      # third-party action is needed. install.sh declares #!/usr/bin/env sh,
      # so lint with --shell=sh to catch bashisms.
      - name: Run ShellCheck
        run: |
          shellcheck --version
          find . -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 --no-run-if-empty shellcheck --shell=sh
