<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#04070B">
<meta name="description" content="A living neural mesh where autonomous agents ride the synapses, converge, and detonate compound ignitions.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Synaptic Compound</title>

<style>
  :root{
    --abyss:#04070B;
    --abyss-2:#081018;
    --steel:#5A8C96;
    --mint:#2BF5C7;
    --amber:#FFB03A;
    --magenta:#FF3D7F;
    --ink:#DCF3EE;
    --ink-dim:#6E8B90;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  }

  *{ box-sizing:border-box; }

  html,body{
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
    overscroll-behavior:none;
    background:var(--abyss);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }

  #stage{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
    background:var(--abyss);
  }

  /* vignette lives on the compositor, not in the 2D context, so it costs
     no per-frame fill on a full-resolution backing store */
  .vignette{
    position:fixed;
    inset:0;
    pointer-events:none;
    background:radial-gradient(ellipse 78% 62% at 50% 50%,
      rgba(4,7,11,0) 0%,
      rgba(4,7,11,.34) 62%,
      rgba(4,7,11,.86) 100%);
  }

  /* ---- HUD ---- */
  .hud{
    position:fixed;
    inset:0;
    pointer-events:none;
    padding:
      calc(env(safe-area-inset-top,0px) + 22px)
      calc(env(safe-area-inset-right,0px) + 20px)
      calc(env(safe-area-inset-bottom,0px) + 20px)
      calc(env(safe-area-inset-left,0px) + 20px);
    display:grid;
    grid-template-rows:auto 1fr auto;
    transition:opacity .5s ease;
  }
  .hud[data-clean="1"]{ opacity:0; }

  .rail{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px;
  }

  .mark{ display:flex; flex-direction:column; gap:6px; }
  .mark b{
    font-family:var(--mono);
    font-size:11px;
    font-weight:600;
    letter-spacing:.22em;
    color:var(--ink);
    text-transform:uppercase;
  }
  .mark span{
    font-family:var(--mono);
    font-size:9.5px;
    letter-spacing:.14em;
    color:var(--ink-dim);
    text-transform:uppercase;
  }
  .mark i{
    display:block;
    width:26px;
    height:1px;
    background:var(--mint);
    opacity:.7;
  }

  .tele{
    display:grid;
    gap:7px;
    justify-items:end;
    font-family:var(--mono);
    font-variant-numeric:tabular-nums;
  }
  .row{
    display:flex;
    align-items:baseline;
    gap:9px;
    font-size:9.5px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--ink-dim);
  }
  .row var{
    font-style:normal;
    font-size:12px;
    letter-spacing:.04em;
    color:var(--ink);
    min-width:44px;
    text-align:right;
  }
  .row var.mint{ color:var(--mint); }
  .row var.amber{ color:var(--amber); }
  .row var.mag{ color:var(--magenta); }

  .meter{
    width:78px;
    height:2px;
    background:rgba(90,140,150,.22);
    position:relative;
    overflow:hidden;
  }
  .meter u{
    position:absolute;
    inset:0 auto 0 0;
    width:0%;
    background:var(--mint);
    box-shadow:0 0 8px var(--mint);
    transition:width .28s ease;
  }

  /* ---- controls ---- */
  .deck{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    pointer-events:auto;
    transition:opacity .6s ease;
  }
  .deck[data-idle="1"]{ opacity:.22; }

  button{
    pointer-events:auto;
    appearance:none;
    background:rgba(8,20,26,.55);
    border:1px solid rgba(43,245,199,.28);
    color:var(--ink);
    font-family:var(--mono);
    font-size:9.5px;
    font-weight:600;
    letter-spacing:.2em;
    text-transform:uppercase;
    padding:10px 15px;
    border-radius:999px;
    cursor:pointer;
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    transition:border-color .2s ease, color .2s ease, background .2s ease, transform .12s ease;
  }
  button:hover{ border-color:rgba(43,245,199,.7); color:var(--mint); }
  button:active{ transform:scale(.95); }
  button:focus-visible{ outline:2px solid var(--mint); outline-offset:3px; }
  button[data-on="1"]{
    border-color:var(--amber);
    color:var(--amber);
    background:rgba(255,176,58,.1);
  }
  button.hot{ border-color:rgba(255,61,127,.45); }
  button.hot:hover{ border-color:var(--magenta); color:var(--magenta); }

  /* ---- title card ---- */
  .card{
    position:fixed;
    inset:0;
    display:grid;
    place-content:center;
    justify-items:center;
    gap:14px;
    text-align:center;
    pointer-events:none;
    padding:32px;
  }
  @keyframes rise{
    from{ opacity:0; transform:translateY(14px); filter:blur(6px); }
    to{ opacity:1; transform:none; filter:blur(0); }
  }
  @keyframes boot{ from{ opacity:0; } to{ opacity:1; } }

  .card em,
  .card h1,
  .card p{ animation:rise .9s cubic-bezier(.2,.7,.2,1) backwards; }
  .card em{ animation-delay:.25s; }
  .card h1{ animation-delay:.45s; }
  .card p{ animation-delay:1.5s; }

  .hud{ animation:boot 1.2s ease 2.4s backwards; }

  @media (prefers-reduced-motion:reduce){
    .card em,.card h1,.card p,.hud{ animation:none; }
  }

  .card em{
    font-family:var(--mono);
    font-style:normal;
    font-size:10px;
    letter-spacing:.42em;
    text-transform:uppercase;
    color:var(--amber);
    text-shadow:0 0 18px rgba(255,176,58,.5);
  }
  .card h1{
    margin:0;
    font-family:var(--sans);
    font-weight:800;
    font-size:clamp(34px,11vw,86px);
    line-height:.92;
    letter-spacing:-.045em;
    text-transform:uppercase;
    text-wrap:balance;
    color:#EEFFFB;
    text-shadow:0 0 44px rgba(43,245,199,.55), 0 0 90px rgba(43,245,199,.22);
  }
  .card p{
    margin:0;
    max-width:30ch;
    font-family:var(--mono);
    font-size:10.5px;
    line-height:1.7;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-dim);
  }

  .toast{
    position:fixed;
    left:50%;
    bottom:calc(env(safe-area-inset-bottom,0px) + 24px);
    transform:translateX(-50%);
    font-family:var(--mono);
    font-size:9.5px;
    letter-spacing:.2em;
    text-transform:uppercase;
    white-space:nowrap;
    color:var(--ink-dim);
    background:rgba(4,7,11,.6);
    border:1px solid rgba(90,140,150,.25);
    padding:9px 14px;
    border-radius:999px;
    opacity:0;
    pointer-events:none;
    transition:opacity .4s ease;
  }
  .toast[data-show="1"]{ opacity:1; }

  @media (max-width:430px){
    .row var{ min-width:38px; font-size:11px; }
    button{ padding:9px 12px; letter-spacing:.16em; }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="vignette"></div>

<div class="hud" id="hud">
  <div class="rail">
    <div class="mark">
      <b>Synaptic Compound</b>
      <i></i>
      <span>Autonomous agents · living mesh</span>
    </div>
    <div class="tele">
      <div class="row">Agents <var class="amber" id="tAgents">0</var></div>
      <div class="row">Spikes·s <var class="mint" id="tSpikes">0</var></div>
      <div class="row">Compounds <var class="mag" id="tComp">0</var></div>
      <div class="row">Coherence <var id="tCoh">0%</var></div>
      <div class="meter"><u id="tBar"></u></div>
    </div>
  </div>

  <div></div>

  <div class="deck" id="deck">
    <button id="bSurge" class="hot" type="button">Surge</button>
    <button id="bStorm" type="button">Storm</button>
    <button id="bClean" type="button">Clean plate</button>
  </div>
</div>

<div class="card" id="card">
  <em>Compound intelligence</em>
  <h1>Synaptic<br>Compound</h1>
  <p>Touch the mesh to fire it</p>
</div>

<div class="toast" id="toast">Double-tap to restore</div>

<script>
(() => {
  "use strict";

  // The publish wrapper owns <head>, so the viewport tag has to be injected.
  if (!document.querySelector('meta[name="viewport"]')) {
    const m = document.createElement("meta");
    m.name = "viewport";
    m.content = "width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1";
    document.head.appendChild(m);
  }

  const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const MINT = "43,245,199";
  const AMBER = "255,176,58";
  const MAG = "255,61,127";
  const STEEL = "90,140,150";

  const cvs = document.getElementById("stage");
  const ctx = cvs.getContext("2d", { alpha: false });

  let W = 0, H = 0, DPR = 1;
  let nodes = [], edges = [], pulses = [], agents = [], rings = [], relics = [];
  let t0 = performance.now(), now = 0, last = t0;
  let spikeCount = 0, spikeRate = 0, compounds = 0, rateClock = 0;
  let storm = false, clean = false, introT = 0;
  let compoundAt = 6.5, compoundTarget = -1, burstFlash = 0;

  /* ---------- glow sprites (cheap bloom) ---------- */
  function sprite(rgb, size) {
    const c = document.createElement("canvas");
    c.width = c.height = size;
    const g = c.getContext("2d");
    const r = size / 2;
    const grd = g.createRadialGradient(r, r, 0, r, r, r);
    grd.addColorStop(0, "rgba(" + rgb + ",1)");
    grd.addColorStop(0.14, "rgba(" + rgb + ",0.62)");
    grd.addColorStop(0.36, "rgba(" + rgb + ",0.17)");
    grd.addColorStop(0.68, "rgba(" + rgb + ",0.04)");
    grd.addColorStop(1, "rgba(" + rgb + ",0)");
    g.fillStyle = grd;
    g.fillRect(0, 0, size, size);
    return c;
  }
  const SP = {
    mint: sprite(MINT, 128),
    amber: sprite(AMBER, 128),
    mag: sprite(MAG, 128),
    white: sprite("235,255,250", 128)
  };
  function blob(img, x, y, r, a) {
    if (a <= 0.004) return;
    ctx.globalAlpha = a > 1 ? 1 : a;
    ctx.drawImage(img, x - r, y - r, r * 2, r * 2);
  }

  /* ---------- substrate ---------- */
  function build() {
    nodes = []; edges = []; pulses = []; agents = []; rings = []; relics = [];
    compoundTarget = -1;

    const target = Math.round((W * H) / 3100);
    const count = Math.max(150, Math.min(360, target));
    const cell = Math.sqrt((W * H) / count);
    const cols = Math.max(2, Math.ceil(W / cell));
    const rows = Math.max(2, Math.ceil(H / cell));
    const cx = W / 2, cy = H / 2;
    const maxD = Math.hypot(cx, cy);

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const jx = (Math.random() - 0.5) * cell * 0.95;
        const jy = (Math.random() - 0.5) * cell * 0.95;
        const x = (c + 0.5) * (W / cols) + jx;
        const y = (r + 0.5) * (H / rows) + jy;
        const z = 0.32 + Math.random() * 0.68;
        nodes.push({
          x, y, z,
          hx: x, hy: y,
          ph: Math.random() * Math.PI * 2,
          sway: 3 + Math.random() * 7,
          charge: -0.6 + Math.random() * 1.55,
          drift: 0.085 + Math.random() * 0.135,
          flash: 0,
          fired: -99,
          rest: 0,
          nb: [],
          reveal: Math.hypot(x - cx, y - cy) / maxD,
          relic: 0
        });
      }
    }

    // synapses: link each neuron to its nearest few, deduped
    const linkMax = cell * 1.85;
    const seen = new Set();
    for (let i = 0; i < nodes.length; i++) {
      const a = nodes[i];
      const near = [];
      for (let j = 0; j < nodes.length; j++) {
        if (i === j) continue;
        const b = nodes[j];
        const d = Math.hypot(a.x - b.x, a.y - b.y);
        if (d < linkMax) near.push({ j, d });
      }
      near.sort((p, q) => p.d - q.d);
      const k = Math.min(near.length, 3 + (Math.random() < 0.45 ? 1 : 0));
      for (let n = 0; n < k; n++) {
        const j = near[n].j;
        const key = i < j ? i + ":" + j : j + ":" + i;
        if (seen.has(key)) continue;
        seen.add(key);
        const e = { a: i, b: j, len: near[n].d, energy: 0 };
        const ei = edges.length;
        edges.push(e);
        nodes[i].nb.push({ n: j, e: ei });
        nodes[j].nb.push({ n: i, e: ei });
      }
    }
    // rescue orphans so no neuron is unreachable
    for (let i = 0; i < nodes.length; i++) {
      if (nodes[i].nb.length) continue;
      let best = -1, bd = Infinity;
      for (let j = 0; j < nodes.length; j++) {
        if (i === j) continue;
        const d = Math.hypot(nodes[i].x - nodes[j].x, nodes[i].y - nodes[j].y);
        if (d < bd) { bd = d; best = j; }
      }
      if (best >= 0) {
        const ei = edges.length;
        edges.push({ a: i, b: best, len: bd, energy: 0 });
        nodes[i].nb.push({ n: best, e: ei });
        nodes[best].nb.push({ n: i, e: ei });
      }
    }

    const fleet = Math.max(5, Math.min(11, Math.round(W * H / 118000) + 4));
    for (let i = 0; i < fleet; i++) spawnAgent(i);

    introT = RM ? 1.4 : 0;
  }

  function spawnAgent(seed) {
    const from = (Math.random() * nodes.length) | 0;
    const nb = nodes[from].nb;
    if (!nb.length) return;
    const pick = nb[(Math.random() * nb.length) | 0];
    agents.push({
      from, to: pick.n, edge: pick.e,
      t: Math.random(),
      speed: 0.24 + Math.random() * 0.16,
      trail: [],
      path: null,
      parked: false,
      hue: seed % 3 === 0 ? MINT : AMBER,
      x: nodes[from].x, y: nodes[from].y
    });
  }

  /* ---------- dynamics ---------- */
  function fire(i, power) {
    const n = nodes[i];
    if (now - n.fired < n.rest) return;
    n.fired = now;
    n.rest = 0.45 + Math.random() * 0.3;
    n.charge = -0.55 - Math.random() * 0.3;   // hyperpolarised: leaves a refractory shadow
    n.flash = 1;
    spikeCount++;
    if (pulses.length > 620) return;
    // excitable medium: a spike only tips neighbours that have already
    // ripened, so fronts sweep into recovered ground and die on the shadow
    const p = Math.min(0.42, power * 0.36);
    if (p < 0.05) return;
    for (const link of n.nb) {
      if (Math.random() < 0.15) continue;
      pulses.push({
        e: link.e, from: i, to: link.n, t: 0,
        v: (150 + Math.random() * 110) / Math.max(24, edges[link.e].len),
        p
      });
    }
  }

  function stimulate(x, y, radius, power) {
    let hit = 0;
    for (let i = 0; i < nodes.length; i++) {
      const n = nodes[i];
      const d = Math.hypot(n.x - x, n.y - y);
      if (d < radius) {
        n.charge += power * (1 - d / radius);
        if (n.charge >= 1) fire(i, 1);
        hit++;
      }
    }
    rings.push({ x, y, r: 8, max: radius * 1.5, life: 1, rgb: MINT, w: 2 });
    return hit;
  }

  function surge() {
    for (let k = 0; k < 14; k++) fire((Math.random() * nodes.length) | 0, 1.15);
    rings.push({ x: W / 2, y: H / 2, r: 10, max: Math.hypot(W, H) * 0.62, life: 1, rgb: MINT, w: 2.4 });
    burstFlash = Math.max(burstFlash, 0.45);
  }

  // breadth-first route across the synaptic graph
  function route(from, to) {
    if (from === to) return [to];
    const prev = new Int32Array(nodes.length).fill(-1);
    const seen = new Uint8Array(nodes.length);
    const q = [from];
    seen[from] = 1;
    for (let h = 0; h < q.length; h++) {
      const cur = q[h];
      for (const link of nodes[cur].nb) {
        if (seen[link.n]) continue;
        seen[link.n] = 1;
        prev[link.n] = cur;
        if (link.n === to) {
          const path = [to];
          let c = to;
          while (prev[c] !== -1) { c = prev[c]; path.push(c); }
          return path.reverse();
        }
        q.push(link.n);
      }
    }
    return null;
  }

  function callCompound() {
    compoundTarget = (Math.random() * nodes.length) | 0;
    let called = 0;
    for (const a of agents) {
      const path = route(a.to, compoundTarget);
      if (path && path.length > 1) { a.path = path.slice(1); called++; }
    }
    if (called < 3) compoundTarget = -1;
  }

  function detonate() {
    const n = nodes[compoundTarget];
    burstFlash = 1;
    compounds++;
    for (let k = 0; k < 3; k++) {
      rings.push({ x: n.x, y: n.y, r: 6 + k * 22, max: 300 + k * 190, life: 1, rgb: k === 1 ? MINT : MAG, w: 3 - k * 0.6 });
    }
    for (let i = 0; i < nodes.length; i++) {
      const d = Math.hypot(nodes[i].x - n.x, nodes[i].y - n.y);
      if (d < 340) { nodes[i].charge += 1.3 * (1 - d / 340); if (nodes[i].charge >= 1) fire(i, 1.25); }
    }
    n.relic = 1;
    relics.push({ i: compoundTarget, born: now });
    if (relics.length > 7) { const old = relics.shift(); nodes[old.i].relic = 0; }
    for (const a of agents) {
      a.parked = false;
      a.path = null;
      const nb = nodes[a.to].nb;
      if (nb.length) {
        const pick = nb[(Math.random() * nb.length) | 0];
        a.from = a.to; a.to = pick.n; a.edge = pick.e; a.t = 0;
      }
    }
    compoundTarget = -1;
    compoundAt = now + (storm ? 7 + Math.random() * 4 : 13 + Math.random() * 8);
  }

  function step(dt) {
    if (introT < 1.4) introT += dt * 0.85;

    // a little extra noise on top of the medium's own ripening
    const rate = (storm ? 5 : 0.7) * (RM ? 0.4 : 1);
    if (Math.random() < rate * dt) fire((Math.random() * nodes.length) | 0, 1);

    // action potentials
    for (let i = pulses.length - 1; i >= 0; i--) {
      const p = pulses[i];
      p.t += p.v * dt * (storm ? 1.5 : 1);
      const e = edges[p.e];
      if (e.energy < p.p) e.energy = p.p;
      if (p.t >= 1) {
        const n = nodes[p.to];
        n.charge += p.p;
        if (n.charge >= 1) fire(p.to, p.p + 0.35);
        pulses.splice(i, 1);
      }
    }

    // frame-rate independent decay
    const dEnergy = Math.exp(-4.2 * dt);
    const dFlash = Math.exp(-(RM ? 4 : 6.4) * dt);
    const ripen = storm ? 2.1 : 1;

    for (let i = 0; i < edges.length; i++) edges[i].energy *= dEnergy;

    for (let i = 0; i < nodes.length; i++) {
      const n = nodes[i];
      // every neuron ripens toward threshold on its own clock
      n.charge += n.drift * ripen * dt;
      if (n.charge >= 1 && now - n.fired > n.rest) fire(i, 1);
      n.flash *= dFlash;
      n.ph += dt * 0.5;
      n.x = n.hx + Math.cos(n.ph) * n.sway * n.z;
      n.y = n.hy + Math.sin(n.ph * 0.83) * n.sway * n.z;
    }

    // agents
    let parked = 0;
    for (const a of agents) {
      if (a.parked) { parked++; continue; }
      const e = edges[a.edge];
      a.t += (a.speed * (storm ? 1.7 : 1) * dt * 190) / Math.max(28, e.len);
      const from = nodes[a.from], to = nodes[a.to];
      a.x = from.x + (to.x - from.x) * a.t;
      a.y = from.y + (to.y - from.y) * a.t;
      a.trail.push(a.x, a.y);
      if (a.trail.length > 64) a.trail.splice(0, a.trail.length - 64);

      if (a.t >= 1) {
        nodes[a.to].charge += 0.95;
        if (nodes[a.to].charge >= 1) fire(a.to, 1.15);
        rings.push({ x: to.x, y: to.y, r: 3, max: 46, life: 1, rgb: a.hue, w: 1.2 });

        if (compoundTarget >= 0 && a.to === compoundTarget) { a.parked = true; a.t = 1; parked++; continue; }

        let next = -1;
        if (a.path && a.path.length) {
          next = a.path.shift();
        } else {
          const nb = nodes[a.to].nb;
          const opts = nb.filter(l => l.n !== a.from);
          const pool = opts.length ? opts : nb;
          next = pool.length ? pool[(Math.random() * pool.length) | 0].n : -1;
        }
        if (next < 0) { a.t = 0; continue; }
        let ei = -1;
        for (const link of nodes[a.to].nb) if (link.n === next) { ei = link.e; break; }
        if (ei < 0) { a.path = null; a.t = 0; continue; }
        a.from = a.to; a.to = next; a.edge = ei; a.t = 0;
      }
    }

    if (compoundTarget >= 0 && parked >= 3) detonate();
    if (compoundTarget < 0 && now > compoundAt) callCompound();

    burstFlash *= Math.exp(-4.4 * dt);

    for (let i = rings.length - 1; i >= 0; i--) {
      const r = rings[i];
      r.r += (r.max - r.r) * dt * 2.6;
      r.life -= dt * 1.05;
      if (r.life <= 0) rings.splice(i, 1);
    }
  }

  /* ---------- render ---------- */
  function draw() {
    // persistence: never a hard clear, so light smears into motion trails
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
    ctx.fillStyle = "rgba(4,7,11,0.30)";
    ctx.fillRect(0, 0, W, H);

    const drift = RM ? 0 : 1;
    const s = 1.03 + Math.sin(now * 0.16) * 0.022 * drift;
    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.scale(s, s);
    ctx.translate(-W / 2 + Math.sin(now * 0.11) * 14 * drift, -H / 2 + Math.cos(now * 0.083) * 12 * drift);

    ctx.globalCompositeOperation = "lighter";
    ctx.lineCap = "round";

    // dormant synapses, batched into one path
    ctx.globalAlpha = 1;
    ctx.beginPath();
    for (let i = 0; i < edges.length; i++) {
      const e = edges[i];
      const a = nodes[e.a], b = nodes[e.b];
      if (a.reveal > introT || b.reveal > introT) continue;
      if (e.energy > 0.05) continue;
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
    }
    ctx.strokeStyle = "rgba(" + STEEL + ",0.16)";
    ctx.lineWidth = 0.7;
    ctx.stroke();

    // charged synapses
    for (let i = 0; i < edges.length; i++) {
      const e = edges[i];
      if (e.energy <= 0.05) continue;
      const a = nodes[e.a], b = nodes[e.b];
      if (a.reveal > introT || b.reveal > introT) continue;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.strokeStyle = "rgba(" + MINT + "," + (e.energy * 0.5).toFixed(3) + ")";
      ctx.lineWidth = 0.7 + e.energy * 1.5;
      ctx.stroke();
    }

    // travelling action potentials
    for (const p of pulses) {
      const a = nodes[p.from], b = nodes[p.to];
      const x = a.x + (b.x - a.x) * p.t;
      const y = a.y + (b.y - a.y) * p.t;
      const tail = Math.max(0, p.t - 0.16);
      ctx.globalAlpha = 1;
      ctx.beginPath();
      ctx.moveTo(a.x + (b.x - a.x) * tail, a.y + (b.y - a.y) * tail);
      ctx.lineTo(x, y);
      ctx.strokeStyle = "rgba(" + MINT + "," + Math.min(0.95, p.p).toFixed(3) + ")";
      ctx.lineWidth = 1 + p.p * 1.6;
      ctx.stroke();
      blob(SP.mint, x, y, 9 + p.p * 12, p.p * 0.5);
    }

    // neurons
    for (let i = 0; i < nodes.length; i++) {
      const n = nodes[i];
      if (n.reveal > introT) continue;
      const pop = Math.min(1, (introT - n.reveal) * 3.2);
      const base = 1.1 + n.z * 1.5;
      // charge reads as glow, so the mesh visibly ripens between waves
      const c = n.charge < 0 ? 0 : n.charge > 1 ? 1 : n.charge;
      const heat = c * c * c;
      // cold neurons skip the glow pass entirely — most of the mesh, most frames
      if (heat > 0.05) blob(SP.mint, n.x, n.y, (5 + n.z * 6 + heat * 9) * pop, (0.02 + heat * 0.26) * pop);
      if (n.flash > 0.01) {
        blob(SP.white, n.x, n.y, (10 + n.flash * 26) * pop, n.flash * 0.45 * pop);
        blob(SP.mint, n.x, n.y, (18 + n.flash * 50) * pop, n.flash * 0.3 * pop);
      }
      ctx.globalAlpha = (0.2 + n.z * 0.3 + heat * 0.4) * pop;
      ctx.fillStyle = n.flash > 0.15 ? "#EEFFFB" : "rgba(" + MINT + ",0.85)";
      ctx.beginPath();
      ctx.arc(n.x, n.y, base + n.flash * 1.8, 0, 6.2832);
      ctx.fill();

      // compound relics: structure the mesh keeps after a merge
      if (n.relic > 0) {
        const spin = now * 1.1 + i;
        ctx.globalAlpha = 0.75;
        ctx.strokeStyle = "rgba(" + MAG + ",0.8)";
        ctx.lineWidth = 1.1;
        ctx.beginPath();
        for (let k = 0; k < 4; k++) {
          const ang = spin + (k * Math.PI) / 2;
          const rr = 9 + Math.sin(now * 2 + i) * 1.6;
          const px = n.x + Math.cos(ang) * rr;
          const py = n.y + Math.sin(ang) * rr;
          k ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
        }
        ctx.closePath();
        ctx.stroke();
        blob(SP.mag, n.x, n.y, 20, 0.3);
      }
    }

    // convergence lattice: the compound forming
    if (compoundTarget >= 0) {
      const tgt = nodes[compoundTarget];
      const pull = 0.5 + Math.sin(now * 5) * 0.3;
      blob(SP.mag, tgt.x, tgt.y, 40 + pull * 26, 0.45);
      ctx.globalAlpha = 0.5;
      ctx.strokeStyle = "rgba(" + MAG + ",0.55)";
      ctx.lineWidth = 0.9;
      ctx.setLineDash([3, 7]);
      ctx.lineDashOffset = -now * 34;
      ctx.beginPath();
      for (const a of agents) { ctx.moveTo(a.x, a.y); ctx.lineTo(tgt.x, tgt.y); }
      ctx.stroke();
      ctx.setLineDash([]);

      const locked = agents.filter(a => a.parked);
      if (locked.length > 1) {
        ctx.globalAlpha = 0.7;
        ctx.strokeStyle = "rgba(" + MAG + ",0.85)";
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        for (let i = 0; i < locked.length; i++) {
          for (let j = i + 1; j < locked.length; j++) {
            ctx.moveTo(locked[i].x, locked[i].y);
            ctx.lineTo(locked[j].x, locked[j].y);
          }
        }
        ctx.stroke();
      }
    }

    // agents
    // trails stroke as four tapering bands rather than one path per segment
    const BANDS = 4;
    for (const a of agents) {
      const tr = a.trail;
      const pts = tr.length / 2;
      if (pts > 2) {
        ctx.globalAlpha = 1;
        for (let b = 0; b < BANDS; b++) {
          const lo = Math.floor((pts - 1) * (b / BANDS));
          const hi = Math.ceil((pts - 1) * ((b + 1) / BANDS));
          const f = (b + 1) / BANDS;
          ctx.beginPath();
          ctx.moveTo(tr[lo * 2], tr[lo * 2 + 1]);
          for (let i = lo + 1; i <= hi; i++) ctx.lineTo(tr[i * 2], tr[i * 2 + 1]);
          ctx.strokeStyle = "rgba(" + a.hue + "," + (f * f * 0.5).toFixed(3) + ")";
          ctx.lineWidth = 0.5 + f * 2.1;
          ctx.stroke();
        }
      }
      const img = a.hue === MINT ? SP.mint : SP.amber;
      blob(img, a.x, a.y, 30, 0.4);
      blob(SP.white, a.x, a.y, 8, 0.75);
      ctx.globalAlpha = 1;
      ctx.fillStyle = "#FFF6E8";
      ctx.beginPath();
      ctx.arc(a.x, a.y, 1.9, 0, 6.2832);
      ctx.fill();
    }

    // shockwaves
    for (const r of rings) {
      ctx.globalAlpha = Math.max(0, r.life) * 0.5;
      ctx.strokeStyle = "rgba(" + r.rgb + ",1)";
      ctx.lineWidth = r.w * r.life;
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r, 0, 6.2832);
      ctx.stroke();
    }

    ctx.restore();

    // detonation bloom over the whole frame
    if (burstFlash > 0.01) {
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = burstFlash * 0.16;
      ctx.fillStyle = "#FF3D7F";
      ctx.fillRect(0, 0, W, H);
    }

    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
  }

  /* ---------- loop ---------- */
  let raf = 0;
  function frame(ts) {
    raf = requestAnimationFrame(frame);
    const dt = Math.min(0.05, (ts - last) / 1000);
    last = ts;
    now = (ts - t0) / 1000;
    governQuality(dt);
    step(dt);
    draw();

    rateClock += dt;
    if (rateClock > 0.4) {
      spikeRate = Math.round(spikeCount / rateClock);
      spikeCount = 0;
      rateClock = 0;
      let live = 0;
      for (const n of nodes) if (now - n.fired < 1.3) live++;
      const coh = Math.round((live / Math.max(1, nodes.length)) * 100);
      tAgents.textContent = String(agents.length).padStart(2, "0");
      tSpikes.textContent = String(spikeRate);
      tComp.textContent = String(compounds).padStart(2, "0");
      tCoh.textContent = coh + "%";
      tBar.style.width = Math.min(100, coh * 2.4) + "%";
    }
  }

  /* ---------- chrome ---------- */
  const hud = document.getElementById("hud");
  const deck = document.getElementById("deck");
  const card = document.getElementById("card");
  const toast = document.getElementById("toast");
  const tAgents = document.getElementById("tAgents");
  const tSpikes = document.getElementById("tSpikes");
  const tComp = document.getElementById("tComp");
  const tCoh = document.getElementById("tCoh");
  const tBar = document.getElementById("tBar");

  let idleTimer = 0;
  function wake() {
    deck.dataset.idle = "0";
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { deck.dataset.idle = "1"; }, 4200);
  }
  wake();

  let lastTap = 0;
  cvs.addEventListener("pointerdown", (e) => {
    const t = performance.now();
    if (clean && t - lastTap < 320) {
      clean = false;
      hud.dataset.clean = "0";
      toast.dataset.show = "0";
      wake();
    }
    lastTap = t;
    stimulate(e.clientX, e.clientY, 190, 1.25);
  });
  cvs.addEventListener("pointermove", (e) => {
    if (e.pressure > 0 || e.buttons) stimulate(e.clientX, e.clientY, 120, 0.55);
  });
  addEventListener("pointermove", wake, { passive: true });

  document.getElementById("bSurge").addEventListener("click", () => { surge(); wake(); });

  const bStorm = document.getElementById("bStorm");
  bStorm.addEventListener("click", () => {
    storm = !storm;
    bStorm.dataset.on = storm ? "1" : "0";
    if (storm) { while (agents.length < 14) spawnAgent(agents.length); surge(); }
    else { agents.length = Math.max(6, agents.length - 4); }
    wake();
  });

  document.getElementById("bClean").addEventListener("click", () => {
    clean = true;
    hud.dataset.clean = "1";
    toast.dataset.show = "1";
    setTimeout(() => { toast.dataset.show = "0"; }, 2600);
  });

  addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if (k === "h") { clean = !clean; hud.dataset.clean = clean ? "1" : "0"; }
    if (k === "s") surge();
    if (k === " ") { e.preventDefault(); surge(); }
  });

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { cancelAnimationFrame(raf); raf = 0; }
    else if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); }
  });

  // Adaptive resolution: a dropped frame is visible in a recording, so the
  // page trades pixel density for a steady frame rate rather than the reverse.
  const QSTEPS = [2, 1.5, 1.25, 1];
  let qi = 0, ftAcc = 0, ftN = 0, qHold = 0;

  function backingStore() {
    const cap = Math.min(devicePixelRatio || 1, QSTEPS[qi]);
    DPR = W * H > 1100000 ? Math.min(cap, 1.5) : cap;
    cvs.width = Math.round(W * DPR);
    cvs.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = "#04070B";
    ctx.fillRect(0, 0, W, H);
  }

  function governQuality(dt) {
    if (qHold > 0) { qHold -= dt; return; }
    ftAcc += dt; ftN++;
    if (ftN < 60) return;
    const avg = ftAcc / ftN;
    ftAcc = 0; ftN = 0;
    if (avg > 0.0225 && qi < QSTEPS.length - 1) {
      qi++;
      backingStore();
      qHold = 1.5;
    }
  }

  let rt = 0;
  function resize() {
    W = innerWidth; H = innerHeight;
    backingStore();
    build();
  }
  addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(resize, 180); });

  resize();
  raf = requestAnimationFrame(frame);

  // opening beat: mesh writes itself in, then the first cascade, then the title clears
  setTimeout(() => stimulate(W / 2, H / 2, Math.min(W, H) * 0.55, 1.5), RM ? 400 : 1500);
  setTimeout(() => {
    card.style.transition = "opacity 1.1s ease, transform 1.1s ease";
    card.style.opacity = "0";
    card.style.transform = "scale(1.04)";
  }, RM ? 3200 : 3600);
})();
</script>
</body>
</html>
